<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Chamud Pathirana — AI Engineer. Flight path: Colombo, Hakodate, Sapporo.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <path id="route" d="M 80 320 C 300 220, 420 360, 600 290 S 900 180, 1120 230"/>
    <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- telemetry -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5eead4" fill-opacity="0.75" text-anchor="end">
      <text x="1150" y="52">FLIGHT PLAN // CGP-2026</text>
      <text x="1150" y="74">43.06°N 141.35°E · ALT 120 m</text>
      <text x="1150" y="96">STATUS: AIRBORNE<tspan fill="#f472b6"> ●<animate attributeName="fill-opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/></tspan></text>
    </g>

    <!-- title -->
    <text x="60" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#f1f5f9" letter-spacing="2">CHAMUD PATHIRANA</text>
    <text x="62" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5eead4">AI Engineer — Drones · Robotics · 3D Vision · LLM Agents</text>
    <text x="62" y="180" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif" font-size="17" fill="#94a3b8">チャムッド パティラナ ｜ AIエンジニア — ドローン・ロボティクス・3Dビジョン・LLMエージェント</text>

    <!-- planned route (dashed) and flown trail (solid, drawn in sync with the drone) -->
    <use xlink:href="#route" href="#route" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
    <use xlink:href="#route" href="#route" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.8;1" dur="12s" repeatCount="indefinite"/>
    </use>

    <!-- waypoints -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">
      <g>
        <circle cx="80" cy="320" r="6" fill="#0a1020" stroke="#fbbf24" stroke-width="2.5"/>
        <circle cx="80" cy="320" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5">
          <animate attributeName="r" values="6;18" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="70" y="352"><tspan fill="#fbbf24">WP01</tspan> COLOMBO · 2019</text>
        <text x="70" y="370" fill="#94a3b8" font-size="12">Software engineering</text>
      </g>
      <g>
        <circle cx="600" cy="290" r="6" fill="#0a1020" stroke="#fbbf24" stroke-width="2.5"/>
        <circle cx="600" cy="290" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5">
          <animate attributeName="r" values="6;18" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <text x="600" y="326" text-anchor="middle"><tspan fill="#fbbf24">WP02</tspan> HAKODATE · 2023</text>
        <text x="600" y="344" text-anchor="middle" fill="#94a3b8" font-size="12">Drone research · FUN ROBO LAB.</text>
      </g>
      <g>
        <circle cx="1120" cy="230" r="6" fill="#0a1020" stroke="#fbbf24" stroke-width="2.5"/>
        <circle cx="1120" cy="230" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5">
          <animate attributeName="r" values="6;18" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="1130" y="266" text-anchor="end"><tspan fill="#fbbf24">WP03</tspan> SAPPORO · 2026</text>
        <text x="1130" y="284" text-anchor="end" fill="#94a3b8" font-size="12">AI Engineer · Quark Inc</text>
      </g>
    </g>

    <!-- drone (top-down quadcopter) following the route -->
    <g>
      <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear">
        <mpath xlink:href="#route" href="#route"/>
      </animateMotion>
      <g stroke="#f1f5f9" stroke-width="3" stroke-linecap="round">
        <line x1="-15" y1="-15" x2="15" y2="15"/>
        <line x1="-15" y1="15" x2="15" y2="-15"/>
      </g>
      <g fill="#5eead4" fill-opacity="0.18" stroke="#5eead4" stroke-width="1.5">
        <circle cx="-15" cy="-15" r="9"/>
        <circle cx="15" cy="-15" r="9"/>
        <circle cx="-15" cy="15" r="9"/>
        <circle cx="15" cy="15" r="9"/>
      </g>
      <g stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round">
        <line x1="-22" y1="-15" x2="-8" y2="-15"><animateTransform attributeName="transform" type="rotate" from="0 -15 -15" to="360 -15 -15" dur="0.35s" repeatCount="indefinite"/></line>
        <line x1="8" y1="-15" x2="22" y2="-15"><animateTransform attributeName="transform" type="rotate" from="360 15 -15" to="0 15 -15" dur="0.35s" repeatCount="indefinite"/></line>
        <line x1="-22" y1="15" x2="-8" y2="15"><animateTransform attributeName="transform" type="rotate" from="360 -15 15" to="0 -15 15" dur="0.35s" repeatCount="indefinite"/></line>
        <line x1="8" y1="15" x2="22" y2="15"><animateTransform attributeName="transform" type="rotate" from="0 15 15" to="360 15 15" dur="0.35s" repeatCount="indefinite"/></line>
      </g>
      <rect x="-7" y="-7" width="14" height="14" rx="4" fill="#f1f5f9"/>
      <circle cx="0" cy="-3" r="2" fill="#f472b6"/>
    </g>
  </g>
</svg>
